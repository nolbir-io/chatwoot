      description: "OpenAI dan katta til modellarining kuchidan javob taklif qilish, xulosa chiqarish, xabarni qayta ifodalash, imlo tekshirish va yorliq tasniflash kabi xususiyatlar bilan foydalaning."
    linear:
      name: "Linear"
      description: "Suhbat oynasidan to'g'ridan-to'g'ri Linear da muammolarni yarating. Yoki muammolarni kuzatish jarayonini yanada samaraliroq qilish uchun mavjud Linear muammolarini bog'lang."
    captain:
      name: "Captain"
      description: "Captain - bu mahsulotingiz uchun yaratilgan va kompaniyangizning bilimlar bazasida o'qitilgan mahalliy AI yordamchisi. U inson kabi javob beradi va mijoz so'rovlarini samarali hal qiladi. Uni kirish qutingizga osongina sozlang."
